name: Self-hosted compile check

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tools/**'
      - '.github/workflows/build-selfhosted.yml'

jobs:
  compile-check:
    runs-on: [self-hosted, shatterdome]
    steps:
      - uses: actions/checkout@v4

      - name: Clone SeriousProton
        run: |
          rm -rf ../SeriousProton
          git clone --depth 1 https://github.com/daid/SeriousProton.git ../SeriousProton

      - name: Compile smoke test
        run: ./tools/build-compile-check.sh
        env:
          PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin

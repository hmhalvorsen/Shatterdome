name: Release

# Self-hosted only: no GitHub-hosted runner minutes, no Actions artifact storage.
# Builds run on the local shatterdome runner via Colima/Docker; assets upload straight to the release.

on:
  push:
    tags:
      - 'SD-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. SD-2026.08.26)'
        required: true
        type: string
        default: SD-2026.08.26

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-self-hosted
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: [self-hosted, shatterdome]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Restore release build tools
        run: |
          git fetch origin master
          git checkout origin/master -- \
            tools/build-linux.sh \
            tools/build-raspberrypi.sh \
            tools/build-windows.sh \
            tools/build-release-docker.sh \
            tools/ensure-docker.sh \
            tools/publish-release.sh \
            tools/verify-release-packages.sh
          chmod +x tools/*.sh

      - name: Ensure Docker is running
        run: ./tools/ensure-docker.sh arm64

      - name: Build Linux ARM64 (Raspberry Pi)
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: ./tools/build-release-docker.sh linux-arm64

      - name: Build Linux amd64
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: ./tools/build-release-docker.sh linux-amd64

      - name: Build Windows amd64
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: ./tools/build-release-docker.sh windows-amd64

      - name: Verify release packages
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: ./tools/verify-release-packages.sh all

      - name: Publish GitHub Release
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-release.sh
